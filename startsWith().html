<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StartWith()</title>
</head>
<body>

<script>
    let str = "www.ijse.com";
    console.log(str);
    // true
    console.log(str.startsWith("www"));
    // false
    console.log(str.startsWith("eww"));

    // return to boolean value;


</script>

</body>
</html>
