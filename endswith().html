<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EndWith()</title>
</head>
<body>

  <script>
    let str = "www.ijse.com";
    console.log(str);
    // false
    console.log(str.endsWith("www"));
    // true
    console.log(str.endsWith("com"));
    // false
    console.log(str.endsWith("cm"));

    // return to boolean Value


  </script>


</body>
</html>
