<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CharAt()</title>
</head>
<body>

<script>
  let str = "Hello World"
  console.log(str)

  console.log(str.charAt(4))

  // h-0
  // e-1
  // l-2
  // l-3
  // o-4
  // w-5
  // o-6
  // l-7
  // d-8

</script>

</body>
</html>
